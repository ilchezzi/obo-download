<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Download ONE BY ONE for macOS">
  <title>ONE BY ONE — Download</title>
  <style>
    @font-face { font-family: "Space Grotesk"; src: url("./space-grotesk-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0c0c0c; color: #efefef; font-family: "Space Grotesk", sans-serif; }
    main { min-height: 100svh; display: grid; place-content: center; justify-items: center; padding: 24px; gap: 20px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-width: 220px; min-height: 64px; padding: 18px 32px; border-radius: 10px; background: #efefef; color: #0c0c0c; font-size: 20px; font-weight: 500; text-decoration: none; }
    a:hover { background: #ffda56; }
    a:focus-visible { outline: 3px solid #ffda56; outline-offset: 6px; }
    a[aria-disabled="true"] { opacity: .5; cursor: wait; }
    p { margin: 0; max-width: 420px; text-align: center; font-size: 14px; line-height: 1.5; color: #b8b8b8; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <a id="download" aria-disabled="true" aria-label="Download ONE BY ONE for macOS, Apple Silicon">Download</a>
    <p id="status" role="status" hidden></p>
  </main>
  <script src="./download.js"></script>
</body>
</html>
